version: "3"
services:
    $mssql1:
      image: jpomfret7/$mssql1:v0.17.0
      volumes:
        - mydata:/var/opt/backups
        - shared:/shared
        # Update this to wherever you want VS Code to mount the folder of your project
        - ..:/workspace:cached
      ports:
        - "8801:1433"
      container_name: $mssql1
      hostname: $mssql1
      
    $mssql2:
      image: jpomfret7/$mssql2:v0.17.0
      volumes:
        - mydata:/var/opt/backups
        - shared:/shared
        # Update this to wherever you want VS Code to mount the folder of your project
        # So that the second container is rebuilt everytime as well 
        - ..:/somewhereweirdworkspace:cached
      ports:
        - "8802:1433"
      container_name: $mssql2
      hostname: $mssql2


volumes:
  mydata:
  shared: